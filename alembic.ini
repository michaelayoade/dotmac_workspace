[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# version_locations is composed PROGRAMMATICALLY — see
# src/dotmac_workspace/migrations.py. Two of the three lineages (the kernel's
# and the application-directory module's) live in INSTALLED packages whose
# paths are environment-specific, so they are located through their owners'
# public locators rather than hard-coded here. Migrations run via
# `make migrate`, never the raw `alembic` CLI, so all three always compose.
path_separator = space
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
