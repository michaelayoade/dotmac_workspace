name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Candidate jobs only restore caches. A PR can edit its own workflow, so
# verification against the checked-in lock remains the byte-integrity gate.
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  POETRY_VERSION: '2.2.0'

jobs:
  quality:
    name: Static checks and DB-free tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Require reviewed PR dependency snapshot
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${PR_HEAD_SHA}^{commit}"; then
            echo 'PR head commit unavailable for dependency comparison' >&2
            exit 2
          fi
          if ! cmp -s pyproject.toml <(git show "${PR_HEAD_SHA}:pyproject.toml") ||
             ! cmp -s poetry.lock <(git show "${PR_HEAD_SHA}:poetry.lock"); then
            echo 'Merge dependencies differ from reviewed PR head; update the branch and rewarm' >&2
            exit 2
          fi
      - name: Restore exact wheelhouse
        id: wheelhouse-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/workspace-wheelhouse
          key: workspace-wheelhouse-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('pyproject.toml', 'poetry.lock') }}
          fail-on-cache-miss: true
      - name: Reject partial cache matches
        env:
          CACHE_HIT: ${{ steps.wheelhouse-cache.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: Verify and install locked dependencies offline
        run: |
          python -m venv .ci-venv
          python scripts/workspace_wheelhouse.py install \
            --directory "$RUNNER_TEMP/workspace-wheelhouse" \
            --python .ci-venv/bin/python
          echo "$GITHUB_WORKSPACE/.ci-venv/bin" >> "$GITHUB_PATH"
      - name: Build and install Workspace wheel offline
        run: |
          pipx install "poetry==${POETRY_VERSION}"
          poetry check --lock
          poetry build --format wheel
          .ci-venv/bin/python -m pip install --no-index --no-deps dist/dotmac_workspace-*.whl
          .ci-venv/bin/python -m pip check
      - name: Lint, types, format, and DB-free tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: |
          make PYTHON= check
          make PYTHON= test

  postgres:
    name: Composed migrations and tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: '5434'
      TEST_DB_NAME: workspace_test
      TEST_DB_ADMIN_USER: postgres
      TEST_DB_ADMIN_PASSWORD: postgres
      TEST_DB_USER: app_user
      TEST_DB_PASSWORD: app_user
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Require reviewed PR dependency snapshot
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${PR_HEAD_SHA}^{commit}"; then
            echo 'PR head commit unavailable for dependency comparison' >&2
            exit 2
          fi
          if ! cmp -s pyproject.toml <(git show "${PR_HEAD_SHA}:pyproject.toml") ||
             ! cmp -s poetry.lock <(git show "${PR_HEAD_SHA}:poetry.lock"); then
            echo 'Merge dependencies differ from reviewed PR head; update the branch and rewarm' >&2
            exit 2
          fi
      - name: Restore exact wheelhouse
        id: wheelhouse-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/workspace-wheelhouse
          key: workspace-wheelhouse-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('pyproject.toml', 'poetry.lock') }}
          fail-on-cache-miss: true
      - name: Reject partial cache matches
        env:
          CACHE_HIT: ${{ steps.wheelhouse-cache.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: Verify and install locked dependencies offline
        run: |
          python -m venv .ci-venv
          python scripts/workspace_wheelhouse.py install \
            --directory "$RUNNER_TEMP/workspace-wheelhouse" \
            --python .ci-venv/bin/python
          echo "$GITHUB_WORKSPACE/.ci-venv/bin" >> "$GITHUB_PATH"
      - name: Build and install Workspace wheel offline
        run: |
          pipx install "poetry==${POETRY_VERSION}"
          poetry check --lock
          poetry build --format wheel
          .ci-venv/bin/python -m pip install --no-index --no-deps dist/dotmac_workspace-*.whl
          .ci-venv/bin/python -m pip check
      - name: Compose all three lineages against PostgreSQL
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: make PYTHON= test-db-up
      - name: Migration-composition and tenant-isolation canaries
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: make PYTHON= test-db
      - name: Tear down
        if: always()
        run: make PYTHON= test-db-down

  from-wheel:
    name: Boot from a built wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Require reviewed PR dependency snapshot
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${PR_HEAD_SHA}^{commit}"; then
            echo 'PR head commit unavailable for dependency comparison' >&2
            exit 2
          fi
          if ! cmp -s pyproject.toml <(git show "${PR_HEAD_SHA}:pyproject.toml") ||
             ! cmp -s poetry.lock <(git show "${PR_HEAD_SHA}:poetry.lock"); then
            echo 'Merge dependencies differ from reviewed PR head; update the branch and rewarm' >&2
            exit 2
          fi
      - name: Restore exact wheelhouse
        id: wheelhouse-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/workspace-wheelhouse
          key: workspace-wheelhouse-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('pyproject.toml', 'poetry.lock') }}
          fail-on-cache-miss: true
      - name: Reject partial cache matches
        env:
          CACHE_HIT: ${{ steps.wheelhouse-cache.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: Build, install, and boot from the wheel
        env:
          WHEELHOUSE_ROOT: ${{ runner.temp }}/workspace-wheelhouse
        run: |
          pipx install "poetry==${POETRY_VERSION}"
          poetry check --lock
          make from-wheel-boot
