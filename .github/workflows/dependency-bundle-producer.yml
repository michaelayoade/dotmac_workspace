name: Warm Workspace wheelhouse

on:
  push:
    branches: [main]
  workflow_dispatch:

# This protected-main workflow saves the wheelhouse; candidate CI only restores.
permissions:
  contents: read

jobs:
  warm:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dependency-bundle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify protected revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify manifest and lock agree
        run: |
          pipx install 'poetry==2.2.0'
          poetry check --lock
      - name: Acquire and verify locked wheels
        env:
          FORGEJO_BUNDLE_READ_TOKEN: ${{ secrets.FORGEJO_BUNDLE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$FORGEJO_BUNDLE_READ_TOKEN" ]; then
            echo 'registry-read credential unavailable' >&2
            exit 2
          fi
          echo "::add-mask::$FORGEJO_BUNDLE_READ_TOKEN"
          python scripts/workspace_wheelhouse.py warm --directory "$RUNNER_TEMP/workspace-wheelhouse"
      - name: Save exact lock cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/workspace-wheelhouse
          key: workspace-wheelhouse-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('pyproject.toml', 'poetry.lock') }}
