name: Verify Workspace's locked private wheels
description: Observe a protected main bundle and build an offline wheel index

outputs:
  expected-file:
    value: ${{ steps.expected.outputs.path }}
  index-root:
    value: ${{ steps.bundle.outputs.index-root }}

runs:
  using: composite
  steps:
    - name: Derive the exact private-wheel plan from this revision
      id: expected
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/workspace_dependency_plan.py > "$RUNNER_TEMP/workspace-expected.json"
        echo "path=$RUNNER_TEMP/workspace-expected.json" >> "$GITHUB_OUTPUT"

    - name: Require reviewed immutable artifact coordinates
      id: coordinates
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/workspace_bundle_coordinates.py \
          --coordinates ci/dependency-bundle.json \
          --github-output "$GITHUB_OUTPUT"

    - name: Verify protected producer and exact wheel bytes
      id: bundle
      uses: michaelayoade/dotmac_starter_mt/.github/actions/verified-dependency-bundle@7ec614c7b8051e7d399d80381ffdb6344d50dbc6
      with:
        operation: verify-and-index
        expected-file: ${{ steps.expected.outputs.path }}
        producer-repository: ${{ github.repository }}
        producer-repository-id: ${{ github.repository_id }}
        producer-workflow-path: .github/workflows/dependency-bundle-producer.yml
        archive-artifact-name: workspace-dependency-bundle
        sidecar-artifact-name: workspace-dependency-bundle-manifest
        archive-artifact-id: ${{ steps.coordinates.outputs.archive_artifact_id }}
        run-id: ${{ steps.coordinates.outputs.run_id }}
        sidecar-artifact-id: ${{ steps.coordinates.outputs.sidecar_artifact_id }}
        github-token: ${{ github.token }}
