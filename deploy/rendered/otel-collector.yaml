        value: dotmac-workspace
        action: upsert
      - key: dotmac.release
        value: 000000000000
        action: upsert
      - key: service.name
        value: dotmac-workspace
        action: upsert
  memory_limiter:
    check_interval: 5s
    limit_percentage: 70
    spike_limit_percentage: 20
  batch:
    timeout: 5s

exporters:
  otlp/platform:
    endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    tls:
      insecure: false

extensions:
  health_check:
    endpoint: 127.0.0.1:13133

service:
  extensions: [health_check]
  telemetry:
