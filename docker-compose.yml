# The Workspace, deployed. One service, because that is all it is.
#
# Not `docker-compose.test.yml`, which stands up a disposable Postgres for the
# migration and RLS canaries and is deliberately separate: a file that served
# both would end up with a production default nobody meant to ship, or a test
# default nobody meant to deploy.
#
# ## No database here
#
# The Workspace's one database lives on the fleet's Postgres host, reached by
# DSN. Running it beside the app would put a stateful volume on the app host and
# make "restore the Workspace" a different procedure from "restore anything
# else". ADR-0021 §1 is about the Workspace sharing no database with a PRODUCT;
# it says nothing about co-locating a server, and the fleet's answer to that is
# already db-primary.
#
# ## Everything by config, nothing hardcoded
#
# Every value is `${VAR:-default}` with the default documented in
# `.env.example`. The three that have NO default — `DATABASE_URL`,
# `WORKSPACE_OIDC_ISSUER`, `WORKSPACE_OIDC_CLIENT_ID` — are deliberately fatal
# when unset: a Workspace with no database is broken, and one with no provider
# serves a `/login` nobody can complete. `configuration_errors` in the assembly
# is what turns that into a refusal to start rather than a healthy-looking
# process.

services:
  workspace:
    # AN IMMUTABLE DIGEST, OR NOTHING. No tag, and no default.
    #
    # This read `${WORKSPACE_IMAGE:-registry.dotmac.io/dotmac/workspace}:${WORKSPACE_TAG:-latest}`
    # until the deployment-foundation adoption. A tag is a registry POINTER: it
    # can be repushed after the bytes it named were tested, so "the image we
    # verified" and "the image this host runs" were two different facts that
    # looked identical in every log — and a bare `docker compose up -d` on a
    # host with no `.env` silently took whatever `:latest` meant that morning.
    # `WORKSPACE_TAG` is retired; there is nothing left here to float on.
    #
    # The value is not typed by hand either. `deploy/rendered/docker-compose.yml`
    # — rendered from `deploy/product.toml` and byte-checked in CI — is the
    # authority for WHICH image production runs, and
    # `scripts/resolve_deploy_image.sh` is how it gets here:
    #
    #     WORKSPACE_IMAGE="$(scripts/resolve_deploy_image.sh)" docker compose up -d
    #
    # That script refuses anything that is not `name@sha256:<64 hex>`, and
    # refuses the all-zero placeholder by name. An unset value refuses here.
    image: ${WORKSPACE_IMAGE:?set it from scripts/resolve_deploy_image.sh — a digest, never a tag}
    restart: unless-stopped
    # Published on loopback only. TLS termination and the public name belong to
    # the reverse proxy; a container port on 0.0.0.0 bypasses ufw entirely
    # (docker writes its own iptables rules), which is how a service intended to
    # be internal ends up reachable from the internet.
    ports:
      - "${WORKSPACE_BIND:-127.0.0.1}:${WORKSPACE_PORT:-8000}:8000"
    environment:
      # ── the database ────────────────────────────────────────────────────
      # The ONLINE role, which holds no DDL privilege. Migrations run as the
      # admin role from the deploy path — see docs/PILOT-RUNBOOK.md.
      DATABASE_URL: ${DATABASE_URL:?the Workspace has no database without this}

      # ── the rest of what the kernel refuses to start without ────────────
      # `validate_settings` treats all of these as FATAL in production. They
      # were missing from this file until 2026-08-16, which meant the only way
      # to run a production Workspace was to hand-edit compose ON the host —
      # and the first `rsync` of a new revision silently reverted it and took
      # the service down. Config that lives only on a host is not configuration,
      # it is an undocumented manual step waiting to be forgotten.
      #
      # Discover this set from `validate_settings` rather than one restart at a
      # time; every one of them is fatal, and finding them serially costs a
      # restart each.
      PLATFORM_DATABASE_URL: ${PLATFORM_DATABASE_URL:?the platform plane has no database without this}
      # Which Host headers this deployment will answer to. Unknown hosts fail
      # closed — an empty value here is not "allow all", it is "serve nobody".
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?an unset trusted-host list serves nobody}
      PLATFORM_ROOT_DOMAIN: ${PLATFORM_ROOT_DOMAIN:?required}
      # All three are secrets and all three come from the environment file,
      # never from a default: a compose default for a signing key is a
      # production key that everybody who has read the repository already knows.
      JWT_SECRET: ${JWT_SECRET:?no default is acceptable for a signing key}
      SESSION_HASH_SECRET: ${SESSION_HASH_SECRET:?no default is acceptable for a session hash key}
      # Fatal in production since kernel 0.1.0a97, and absent from this file
      # before it — so a production start would have carried the kernel's own
      # dev sentinel. At least 32 bytes, and DISTINCT from the two above: one
      # value serving as both a session key and a CSRF key means a single
      # compromise forges both.
      CSRF_SECRET: ${CSRF_SECRET:?no default is acceptable for a CSRF signing key}

      # ── the identity provider ───────────────────────────────────────────
      WORKSPACE_OIDC_ISSUER: ${WORKSPACE_OIDC_ISSUER:?no provider means no login}
      WORKSPACE_OIDC_CLIENT_ID: ${WORKSPACE_OIDC_CLIENT_ID:?required}
      # MUST match the redirect URI registered at the provider exactly —
      # scheme, host, port and path. A mismatch is refused by the provider, not
      # by us, and the error it shows the member says nothing useful.
      WORKSPACE_OIDC_REDIRECT_URL: ${WORKSPACE_OIDC_REDIRECT_URL:?required}
      WORKSPACE_OIDC_PROVIDER_BINDING: ${WORKSPACE_OIDC_PROVIDER_BINDING:-primary}
      WORKSPACE_OIDC_SCOPES: ${WORKSPACE_OIDC_SCOPES:-openid}
      WORKSPACE_OIDC_DISCOVERY_URL: ${WORKSPACE_OIDC_DISCOVERY_URL:-}
      WORKSPACE_OIDC_HTTP_TIMEOUT_SECONDS: ${WORKSPACE_OIDC_HTTP_TIMEOUT_SECONDS:-10}
      WORKSPACE_OIDC_METADATA_TTL_SECONDS: ${WORKSPACE_OIDC_METADATA_TTL_SECONDS:-900}
      WORKSPACE_OIDC_CEREMONY_TTL_SECONDS: ${WORKSPACE_OIDC_CEREMONY_TTL_SECONDS:-600}
      WORKSPACE_OIDC_CLOCK_SKEW_SECONDS: ${WORKSPACE_OIDC_CLOCK_SKEW_SECONDS:-60}

      # The client secret arrives as a FILE, never as a value in this file or
      # in the environment of a `docker inspect`. See `secrets:` below.
      WORKSPACE_OIDC_CLIENT_SECRET_FILE: /run/secrets/workspace_oidc_client_secret

      # ── the proxy in front ──────────────────────────────────────────────
      # `is_secure_request` decides whether the session and ceremony cookies
      # carry `Secure`, and it reads the forwarded scheme. Trusting a proxy
      # that is not actually in front means trusting a header a client can set.
      #
      # THE TRAP, and it bit production for nine days: this service is reached
      # through a PUBLISHED PORT, so the peer address uvicorn sees is the Docker
      # bridge GATEWAY, not `127.0.0.1` — even when the proxy connects to
      # `127.0.0.1:8000` on the host. A bare `127.0.0.1` therefore matches
      # nothing, uvicorn discards `X-Forwarded-Proto`, the app concludes it is
      # serving plain HTTP, and EVERY cookie — `dmws_session` included — is
      # issued without `Secure`. It fails silently: the site works perfectly.
      #
      # Set this to include the gateway. Find it with:
      #   docker inspect -f '{{range .NetworkSettings.Networks}}{{.Gateway}}{{end}}' <container>
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}

      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - workspace_oidc_client_secret
    # `/login` is the one route that must work for the Workspace to be useful,
    # and it renders without a session — so it is the honest health check. A
    # `/` that redirected would report healthy while login was broken.
    #
    # The probe MUST send a `Host` the app trusts. It reaches the app over
    # loopback, so the default header would be `127.0.0.1:8000`, which
    # `TRUSTED_HOSTS` rejects with 400 before routing — and the check then fails
    # forever while the service is perfectly healthy, which is worse than no
    # check at all: a permanently-red probe cannot report a real outage. The
    # host is read from `TRUSTED_HOSTS` rather than written twice, so it stays
    # correct in every deployment.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,urllib.request,sys;
          host=os.environ['TRUSTED_HOSTS'].split(',')[0].strip();
          req=urllib.request.Request('http://127.0.0.1:8000/login',
          headers={'Host': host});
          sys.exit(0 if urllib.request.urlopen(req, timeout=5).status == 200 else 1)"
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      retries: ${HEALTHCHECK_RETRIES:-3}
      start_period: ${HEALTHCHECK_START_PERIOD:-20s}
    # Defence in depth, not a substitute for the non-root user in the image.
    security_opt:
      - no-new-privileges:true
    read_only: ${READ_ONLY_ROOTFS:-true}
    tmpfs:
      - /tmp:size=${TMPFS_SIZE:-64m}
    logging:
      driver: ${LOG_DRIVER:-json-file}
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}

secrets:
  # Written by the deploy path from OpenBao and removed afterwards; the file is
  # never committed and never lives in the repository. The runbook names the
  # OpenBao path — this file names only where the container reads it.
  workspace_oidc_client_secret:
    # The file must be readable by uid 10001 — the image's `workspace` user.
    # A root-owned 600 file mounts through unreadable and the app dies at
    # startup with PermissionError. `chown 10001:10001`, NOT `chmod 644`:
    # world-readable on the host to satisfy a container is the wrong trade.
    file: ${WORKSPACE_OIDC_CLIENT_SECRET_PATH:-./.secrets/workspace_oidc_client_secret}
