[tool.poetry]
name = "dotmac-workspace"
version = "0.1.0a1"
description = "DotMac Tenant Workspace — the customer's cross-application plane, composed from the pinned dotmac-kernel and dotmac-application-directory. It is NOT a vendor control plane and NOT a product data plane (ADR-0021)."
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_workspace", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
# PINNED EXACTLY, resolved ONLY from the private Forgejo index (ADR-0005). No
# path dependencies and no editable installs are ever committed here: this
# assembly lives in a different repository from the packages it consumes, and a
# path dependency would make the build depend on a sibling checkout.
#
# No extras: the `testing` kit was declared and never used, and an unused extra
# is surface a deployment carries and nobody checks. It returns if and when a
# test actually consumes the kernel harness.
# 0.1.0a62 added the authentication-neutral permission seam
# (`deps.permission_guard` over `deps.authorize_party`), which is what lets this
# assembly authorize a COOKIE-authenticated caller against a declared permission
# without re-implementing the kernel's role query. Its absence WAS blocker B1.
# 0.1.0a63 added the external-identity binding workstream 4's login path needs.
# 0.1.0a64 added `external_identity.finalize_external_login` — the ONLY entry
# point a caller may end a session on. It takes the binding under a row lock,
# re-checks under that lock, stamps `last_authenticated_at`, and hands back the
# party so the caller mints its session in the SAME transaction. The pair it
# replaces (`resolve_external_identity` then issue) leaves a window in which an
# administrator can disable a binding and still get a live session derived from
# it, with both audit trails looking correct. This assembly could not close B2
# on a63 without reproducing that window, so the pin moves rather than the code
# working around it.
#
# a67 (2026-08-16) closes the provenance half. `auth_sessions` carries
# `external_identity_binding_id`, and `disable_external_identity_binding`
# revokes the sessions a binding produced — in one transaction, under the same
# row lock, with no opt-out. This assembly stamps that column when it issues a
# session, which is contract point 2: the binding id the FINALIZER returned is
# the column's only legitimate source.
#
# The pin moves rather than the code working around it, for the same reason it
# moved to a64: a shadow column here would make this plane a second writer of
# session revocation, in a different transaction from the kernel's disable.
#
# a97 (2026-08-25) replaces the IMPLICIT browser surface with a declared one.
# Before it, an assembly whose modules carried `web_routers` and which declared
# no facet was mounted anyway, behind an authentication policy the kernel had
# silently downgraded. a97 refuses that composition outright:
# `WebSurfaceRegistry` raises `UnknownFacetError` inside `create_app`. This
# assembly has three such manifests (`identity`, `launcher`, `operator`), so it
# does not boot on a97 until it states, in ONE place, who its browser surface is
# for, how that audience is authenticated, and what admits them — see
# `assembly.py`.
#
# The pin moves rather than the code working around it, for the same reason it
# moved to a64 and a67. A silent authentication downgrade is the worst defect
# available on this plane specifically, and an assembly that answered a97 by
# staying on a70 would keep that defect AND stop receiving every later kernel
# security fix. There is no local mitigation that is not a second authority.
dotmac-kernel = { version = "0.1.0a97", source = "forgejo" }
# The tenant's connected-application portfolio, and the permanent owner of the
# `ApplicationDescriptor` contract (ADR-0021 §4). This assembly is its first
# production consumer: the 2026-08-16 real-IdP pilot at workspace.dotmac.io
# exercised the exact-pinned module, and its Starter dossier now says `adopted`.
# That adopts inventory only; target applications still own authorization and
# their sessions. See docs/ADOPTION-BLOCKERS.md.
#
# 0.1.0a3 floors the kernel at >=0.1.0a56 (the release allocating `mod_appdir` in
# the migration-owner ledger) and its lineage root declares
# `requires=("tenant_scope_catalog.v1", "module_database_roles.v1")` rather than
# naming a foreign revision. THIS assembly answers those requirements — see
# `src/dotmac_workspace/migration_bindings.py`.
dotmac-application-directory = { version = "0.1.0a3", source = "forgejo" }
# The fleet's OIDC relying party (ADR-0006's stateless-protocol-adapter
# classification). This assembly is its FIRST consumer, and the pilot that
# earned its release: the adapter lane was held shut until a real login ran
# against a shared, atomic StateStore rather than a per-process one.
#
# EXACT pin, not a caret. This package ends at a verified (issuer, subject) and
# nothing else — no local party lookup, no session, no cookie, no provider
# branch — so a "compatible" upgrade would still be a change to how identity is
# PROVED here, and that is not a decision to inherit from a resolver.
#
# 0.1.0a1 carries the request-bound `state_store` seam this assembly needs: its
# store holds one request's `Session`, and `dotmac_kernel.db` owns when that
# transaction commits (hard rule 8), so the store cannot be held for the life of
# a client. See `identity/state_store.py`.
dotmac-auth-oidc = { version = "0.1.0a1", source = "forgejo" }
# The fleet's design system (ADR-0006 U1). Every screen this assembly serves is
# a DotMac surface and must look like one; hand-rolled CSS here would be a
# second, private design system that drifts from the fleet's the first time a
# token changes.
#
# It is dependency-free by construction — no kernel, no ORM, no web framework,
# no Jinja — which is exactly what lets this plane adopt the design system
# without adopting anything else, and why the dependency direction stays
# `assembly -> dotmac-ui -> dotmac-kernel`.
#
# Consumed through its published surface only: `static_dir()` and
# `stylesheet_url()`, the two anonymous spec slots in `assembly.py`. No npm, no
# Tailwind, no build step — the compiled stylesheet is committed package data,
# so a checkout works air-gapped. Author against `var(--dmui-<role>)`, never a
# raw hex value, and never invent a `.dmui-*` class: that namespace is reserved
# and only declared components ship (ADR-0006 §5, hard rules 16 and 17). This
# assembly's own markup uses its own `.dmws-*` namespace.
dotmac-ui = { version = "0.1.0a7", source = "forgejo" }
# Starlette's `request.form()` asserts on this being installed — for
# urlencoded bodies too, not only multipart. Every mutating operator control is
# an `hx-post` carrying a urlencoded body, so without it each one 500s. It is a
# real dependency of the surface rather than an optional extra, and is declared
# as one.
python-multipart = "^0.0.9"
uvicorn = { extras = ["standard"], version = "^0.30" }
# The one Workspace database's driver. Separate from every application's
# database by ADR-0021 §1 — there is no product DSN here and no cross-database
# access.
psycopg = { version = "^3.2", extras = ["binary"] }
# Migrations: the kernel's shipped base lineage and the directory module's
# lineage are composed programmatically at deploy time — see `alembic/env.py`.
alembic = "^1.13"
# The OIDC relying-party half. The kernel does no protocol — deliberately, and
# it says so — so discovery, the token exchange and the JWKS fetch are this
# httpx and pyjwt are NOT here any more, and their absence is the point.
#
# They were direct runtime dependencies because this assembly carried its own
# OIDC implementation: its own discovery client, its own JWKS fetch, its own
# ID-token verification. `dotmac-auth-oidc` owns that protocol now, so the
# assembly no longer speaks HTTP to an identity provider or verifies a
# signature, and declaring the libraries that do would claim a capability this
# code does not have. They arrive transitively through the adapter, which is
# where the version floors that matter live — in particular pyjwt >=2.13, a
# SECURITY floor (GHSA-jq35-7prp-9v3f, an algorithm allow-list bypass) that the
# adapter pins and this assembly must not undercut by declaring a looser one.
#
# pyjwt reappears in the dev group: the tests sign ID tokens to stand in for an
# identity provider, which is a test concern and not a runtime one.

# Dotmac packages resolve from Forgejo; everything else from PyPI. `explicit` so
# ONLY the three `dotmac-*` names above are pulled from here — no
# dependency-confusion aggregation of public names.
[[tool.poetry.source]]
name = "forgejo"
url = "https://registry.dotmac.io/api/packages/dotmac/pypi/simple"
priority = "explicit"

# The operator's way in, before anybody can log in: members, their role, and
# their external identity bindings. See `dotmac_workspace.identity.cli`.
[tool.poetry.scripts]
dotmac-workspace = "dotmac_workspace.identity.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
# The tests stand in for an identity provider: they mint ID tokens signed with a
# throwaway RSA key so `dotmac-auth-oidc`'s REAL verification runs against them.
# Stubbing the verifier instead would make the pilot prove nothing — that is
# precisely the defect the package's own dossier records about ERP's suite.
pyjwt = { version = "^2.13", extras = ["crypto"] }
ruff = "^0.6"
mypy = "^1.11"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "RUF"]
ignore = [
    "B008",  # FastAPI dependency injection uses calls in defaults.
]

[tool.ruff.lint.per-file-ignores]
# asserts are the point in tests; S105/S106 flag dummy fixture "passwords"
# that are not real secrets. S608 flags an interpolated table NAME in the
# canaries' raw SQL — the interpolated value is a module constant naming the
# table under test, and every caller-supplied value in those statements is a
# bound parameter. Writing the canaries in the ORM instead would defeat their
# purpose: what is under test is what the DATABASE does, and going through the
# same session the application uses would let an application-side filter
# masquerade as a policy.
"tests/**" = ["S101", "S105", "S106", "S608"]

[tool.ruff.lint.isort]
# `effective_privileges` is this repository's own test helper (`tests/db`), not
# a distribution. Declaring it keeps the corrected isolation method in the
# first-party block, where a reader looks for it.
known-first-party = ["dotmac_workspace", "effective_privileges"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
